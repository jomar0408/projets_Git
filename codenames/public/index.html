<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents secrets</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;margin:0;padding:10px;background:#f4f1ea;color:#222;max-width:700px;margin:auto}
  h1{font-size:20px;text-align:center}
  input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #bbb}
  button{background:#fff;cursor:pointer}
  button.main{background:#2d6a4f;color:#fff;border:none}
  .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
  .row input{flex:1;min-width:0}
  .teams{display:flex;gap:8px}
  .team{flex:1;border-radius:10px;padding:8px;color:#fff}
  .team.red{background:#c0392b}.team.blue{background:#2e6da4}
  .team button{font-size:13px;padding:6px;margin:2px 2px 2px 0}
  .team .me{font-weight:bold;text-decoration:underline}
  .team .off{opacity:.55;font-style:italic}
  #board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}
  .card{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:600;padding:3px;border-radius:8px;background:#fff;border:3px solid #ddd;cursor:pointer;word-break:break-word}
  .card.hint-red{border-color:#c0392b}.card.hint-blue{border-color:#2e6da4}
  .card.hint-neutral{border-color:#cdbf98}.card.hint-assassin{border-color:#000}
  .card.r{cursor:default;color:#fff}
  .card.r.red{background:#c0392b}.card.r.blue{background:#2e6da4}
  .card.r.neutral{background:#cdbf98;color:#222}.card.r.assassin{background:#000}
  #score{display:flex;justify-content:center;gap:6px;font-weight:700;font-size:18px;margin-bottom:6px}
  #score span{padding:4px 12px;border-radius:8px;color:#fff}
  #score .red{background:#c0392b}#score .blue{background:#2e6da4}
  #status{text-align:center;font-weight:600;margin:8px 0}
  #err{color:#c0392b;text-align:center;min-height:20px}
  #chat{margin-top:12px;border:1px solid #ccc;border-radius:10px;background:#fff;padding:8px}
  #chatLog{height:150px;overflow-y:auto;font-size:14px;line-height:1.4;word-break:break-word}
  #chatLog .red{color:#c0392b}#chatLog .blue{color:#2e6da4}
  #chat form{display:flex;gap:6px;margin-top:6px}
  #chat input{flex:1;min-width:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<h1>🕵️ Agents secrets</h1>
<div id="score" hidden></div>
<div id="err"></div>

<div id="lobby">
  <div class="row"><input id="name" placeholder="Ton prénom" maxlength="20"></div>
  <div class="row"><button class="main" onclick="creer()">Créer une partie</button></div>
  <div class="row"><input id="code" placeholder="Code de la salle" maxlength="4" style="text-transform:uppercase"><button onclick="rejoindre()">Rejoindre</button></div>
</div>

<div id="room" hidden>
  <div id="status"></div>
  <div class="teams" id="teams"></div>
  <div class="row" id="startRow"><button class="main" onclick="socket.emit('start')">Lancer la partie</button></div>
  <div id="board"></div>
  <div class="row" id="clueRow" hidden>
    <input id="clueWord" placeholder="Indice (un mot)"><input id="clueNum" type="number" min="0" max="9" value="1" style="max-width:70px">
    <button class="main" onclick="envoyerIndice()">Envoyer</button>
  </div>
  <div class="row" id="endRow" hidden><button onclick="socket.emit('endTurn')">Terminer le tour</button></div>
  <div class="row" id="restartRow" hidden><button class="main" onclick="socket.emit('restart')">Nouvelle partie</button></div>
  <div class="row"><button onclick="quitter()">Quitter la salle</button></div>
  <div id="chat">
    <div id="chatLog"></div>
    <form onsubmit="envoyerMessage();return false"><input id="chatInput" placeholder="Message à la salle" maxlength="200" autocomplete="off"><button>Envoyer</button></form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);
const NOM = {red:'Rouge', blue:'Bleue'};
let S = null;

// Session gardée par onglet : un rafraîchissement renvoie le jeton au serveur pour reprendre sa place
const session = {
  get(){ try { return JSON.parse(sessionStorage.getItem('agents-secrets') || 'null'); } catch { return null; } },
  set(v){ try { sessionStorage.setItem('agents-secrets', JSON.stringify(v)); } catch {} },
  clear(){ try { sessionStorage.removeItem('agents-secrets'); } catch {} }
};
if (session.get()) $('lobby').hidden = true; // évite d'afficher l'accueil pendant la reconnexion
socket.on('connect', () => {
  const s = session.get();
  if (s) socket.emit('rejoin', s);
});
socket.on('session', s => session.set(s));
socket.on('sessionLost', () => { session.clear(); accueil(); });
socket.on('replaced', () => { session.clear(); accueil(); erreur('Cette place a été reprise dans un autre onglet'); });
function quitter(){ socket.emit('leave'); session.clear(); accueil(); }
function accueil(){
  S = null;
  $('lobby').hidden = false;
  $('room').hidden = true;
  $('score').hidden = true;
  $('chatLog').innerHTML = '';
}

function nom(){ return $('name').value.trim() || 'Joueur'; }
function creer(){ socket.emit('create', nom()); }
function rejoindre(){ socket.emit('join', {code:$('code').value, name:nom()}); }
function envoyerIndice(){
  socket.emit('clue', {word:$('clueWord').value, num:$('clueNum').value});
  $('clueWord').value = '';
}
function envoyerMessage(){
  const t = $('chatInput').value.trim();
  if (t) socket.emit('chat', t);
  $('chatInput').value = '';
}
function ajouterMessage(m){
  const log = $('chatLog');
  const enBas = log.scrollTop + log.clientHeight >= log.scrollHeight - 5;
  const div = document.createElement('div');
  div.innerHTML = `<b class="${m.team||''}">${esc(m.name)}</b> : ${esc(m.text)}`;
  log.appendChild(div);
  while (log.children.length > 50) log.firstChild.remove();
  if (enBas) log.scrollTop = log.scrollHeight;
}
socket.on('chatHistory', l => { $('chatLog').innerHTML = ''; l.forEach(ajouterMessage); $('chatLog').scrollTop = 1e9; });
socket.on('chat', ajouterMessage);
function erreur(m){ $('err').textContent = m; setTimeout(() => $('err').textContent = '', 3000); }
socket.on('err', erreur);
socket.on('state', s => { S = s; render(); });

function render(){
  $('lobby').hidden = true;
  $('room').hidden = false;
  const me = S.players.find(p => p.id === S.me);

  // score entre les parties
  $('score').hidden = false;
  $('score').innerHTML = `<span class="red">Rouge ${S.score.red}</span><span class="blue">${S.score.blue} Bleue</span>`;

  // équipes
  $('teams').innerHTML = ['red','blue'].map(t => {
    const list = S.players.filter(p => p.team === t)
      .map(p => `<div class="${p.id===S.me?'me':''} ${p.online?'':'off'}">${p.role==='spy'?'🕵️ ':''}${esc(p.name)}${p.online?'':' (déconnecté)'}</div>`).join('');
    const btns = S.started ? '' :
      `<button onclick="choisirRole('${t}','agent')">Agent</button><button onclick="choisirRole('${t}','spy')">Espion</button>`;
    const reste = S.left ? ` (${S.left[t]})` : '';
    return `<div class="team ${t}"><b>${NOM[t]}${reste}</b>${list}${btns}</div>`;
  }).join('');
  const spectateurs = S.players.filter(p => !p.team).map(p => esc(p.name)).join(', ');

  // statut
  let st = `Salle <b>${S.code}</b> — partage ce code`;
  if (S.started){
    if (S.winner) st = `🏆 Victoire de l'équipe ${NOM[S.winner]} !`;
    else if (!S.clue) st = `Tour de l'équipe ${NOM[S.turn]} — l'espion donne un indice`;
    else st = `Équipe ${NOM[S.turn]} — indice : <b>${esc(S.clue.w)} ${S.clue.n}</b>`;
  } else if (spectateurs) st += `<br><small>Sans équipe : ${spectateurs}</small>`;
  $('status').innerHTML = st;

  $('startRow').hidden = S.started;

  // plateau
  $('board').innerHTML = S.cards ? S.cards.map((c,i) => {
    const cls = c.r ? `r ${c.c}` : (c.c ? `hint-${c.c}` : '');
    return `<div class="card ${cls}" onclick="reveler(${i})">${esc(c.w)}</div>`;
  }).join('') : '';

  const monTour = S.started && !S.winner && me && me.team === S.turn;
  $('clueRow').hidden = !(monTour && me.role === 'spy' && !S.clue);
  $('endRow').hidden = !(monTour && me.role === 'agent' && S.clue);
  $('restartRow').hidden = !S.winner;
}
function choisirRole(team, r){ socket.emit('setRole', {team, role:r}); }
function reveler(i){ socket.emit('reveal', i); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
